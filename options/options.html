<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsTitle"></title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 16px 20px;
        min-width: 380px;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p { margin: 0 0 12px; color: GrayText; }
      form { display: flex; gap: 8px; margin-bottom: 12px; }
      input { flex: 1; padding: 6px 8px; font: inherit; }
      button { font: inherit; padding: 6px 12px; cursor: pointer; }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        display: flex; align-items: center; justify-content: space-between;
        padding: 6px 0; border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
      }
      li button { padding: 2px 10px; }
      .empty { color: GrayText; padding: 6px 0; }
      .status { min-height: 18px; margin-top: 8px; color: GrayText; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1 data-i18n="optionsSitesHeading"></h1>
    <p data-i18n="optionsSitesHelp"></p>
    <form>
      <input name="site" autocomplete="off" spellcheck="false" data-i18n-placeholder="optionsSitePlaceholder" />
      <button type="submit" data-i18n="optionsAddSite"></button>
    </form>
    <ul></ul>
    <div class="empty" data-i18n="optionsNoSites" hidden></div>
    <div class="status" role="status"></div>
    <script src="../shared.js"></script>
    <script src="options.js"></script>
  </body>
</html>
